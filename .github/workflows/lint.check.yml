---

name: Lint

on:
  pull_request:
    branches:
      - main

env:
  BUN_VERSION: '1.3.11'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install
        
      - name: Run lint
        run: bun run lint